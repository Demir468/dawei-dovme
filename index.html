<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141b26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta property="og:title" content="Dawei'yi Dövme — Klasik Flash Stres Atma Oyunu" />
  <meta property="og:description" content="50/50 kaybettin mi? Tokat, yumruk, tekme, domates ve anne terliğiyle tarayıcıdan veya mobilden stres at!" />
  <meta property="og:type" content="website" />
  <title>Dawei'yi Dövme — Klasik Flash Stres Atma Oyunu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="flash-shell">
    <header class="flash-topbar">
      <div class="title-group">
        <span class="swf-badge">FLASH</span>
        <h1 class="game-title">DAWEI'Yİ DÖVME</h1>
      </div>
      <div class="top-controls">
        <button id="btnSfx" class="ctrl-btn" type="button">🔊 Efekt</button>
        <button id="btnVoice" class="ctrl-btn" type="button">🗣️ Ses</button>
        <button id="btnStage" class="ctrl-btn" type="button">🎨 Sahne</button>
        <button id="btnResetTop" class="ctrl-btn danger" type="button" title="Kısayol: R">🩹 Sıfırla</button>
      </div>
    </header>

    <main class="stage-wrap">
      <canvas id="gameCanvas" width="900" height="650"></canvas>
    </main>

    <footer class="flash-footer">
      <div class="weapon-shortcuts" role="radiogroup" aria-label="Saldırı Seçimi">
        <button class="weapon-chip" data-weapon-chip="punch" type="button">
          <span class="chip-icon">👊</span><span class="chip-label">Yumruk</span>
        </button>
        <button class="weapon-chip active" data-weapon-chip="slap" type="button">
          <span class="chip-icon">🖐️</span><span class="chip-label">Tokat</span>
        </button>
        <button class="weapon-chip" data-weapon-chip="kick" type="button">
          <span class="chip-icon">🦶</span><span class="chip-label">Tekme</span>
        </button>
        <button class="weapon-chip" data-weapon-chip="tomato" type="button">
          <span class="chip-icon">🍅</span><span class="chip-label">Domates</span>
        </button>
        <button class="weapon-chip" data-weapon-chip="slipper" type="button">
          <span class="chip-icon">🩴</span><span class="chip-label">Terlik</span>
        </button>
      </div>
      <div class="stats-pill">
        <span>Darbe: <strong id="statHits">0</strong></span>
        <span>Hasar: <strong id="statDamage">%0</strong></span>
      </div>
    </footer>
  </div>

  <script src="assets/dawei-data.js"></script>
  <script src="audio.js"></script>
  <script src="damage-renderer.js"></script>
  <script src="mesh.js"></script>
  <script src="game.js"></script>
</body>
</html>
